<!DOCTYPE html>
<html class="dark" lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>JUMP - Barbearias</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#0d59f2",
            "background-light": "#f5f6f8",
            "background-dark": "#000000",
          },
          fontFamily: {
            "display": ["Inter", "sans-serif"]
          },
          borderRadius: {
            "DEFAULT": "1rem",
            "lg": "1.25rem",
            "xl": "3rem",
            "full": "9999px"
          },
        },
      },
    }
  </script>
  <style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    .squircle-radius {
      border-radius: 20px;
    }
    body {
      background-color: #000000;
    }
  </style>
</head>
<body class="bg-background-dark font-display text-white antialiased">
  <div class="flex min-h-screen w-full flex-col items-center justify-between px-6 pb-32">
    <!-- Header -->
    <div class="w-full max-w-[400px] mt-6">
      <div class="flex items-center justify-between mb-6">
        <div>
          <h1 class="text-3xl font-bold">Barbearias</h1>
          <p class="text-sm text-gray-400 mt-1">Encontre a melhor para você</p>
        </div>
        <a href="home.html" class="p-3 bg-[#1c1c1e] rounded-full hover:bg-[#2c2c2e] transition-colors">
          <span class="material-symbols-outlined">arrow_back</span>
        </a>
      </div>

      <!-- Search Bar -->
      <div class="mb-4">
        <div class="relative">
          <input id="searchInput" class="w-full h-12 bg-[#1c1c1e] border border-gray-800 focus:border-primary focus:ring-1 focus:ring-primary text-white squircle-radius px-4 pr-12 placeholder:text-gray-600 transition-all outline-none" placeholder="Buscar barbearia..." type="text"/>
          <span class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-500 material-symbols-outlined">search</span>
        </div>
      </div>

      <!-- Filter Tabs -->
      <div class="flex gap-2 mb-6 overflow-x-auto pb-2">
        <button class="filter-tab active px-4 py-2 bg-primary text-white rounded-full text-sm font-medium whitespace-nowrap" data-filter="all">
          Todos
        </button>
        <button class="filter-tab px-4 py-2 bg-[#1c1c1e] text-gray-400 rounded-full text-sm font-medium whitespace-nowrap hover:bg-[#2c2c2e]" data-filter="nearby">
          Perto de você
        </button>
        <button class="filter-tab px-4 py-2 bg-[#1c1c1e] text-gray-400 rounded-full text-sm font-medium whitespace-nowrap hover:bg-[#2c2c2e]" data-filter="rated">
          Mais avaliados
        </button>
      </div>

      <!-- Loading State -->
      <div id="loadingState" class="space-y-4">
        <div class="h-24 bg-[#1c1c1e] squircle-radius animate-pulse"></div>
        <div class="h-24 bg-[#1c1c1e] squircle-radius animate-pulse"></div>
        <div class="h-24 bg-[#1c1c1e] squircle-radius animate-pulse"></div>
      </div>

      <!-- Barbershops List -->
      <div id="barbershopsList" class="space-y-4 hidden">
        <!-- Dinamicamente preenchido pelo JavaScript -->
      </div>

      <!-- Empty State -->
      <div id="emptyState" class="hidden text-center py-12">
        <span class="material-symbols-outlined text-5xl text-gray-600 block mb-4">storefront</span>
        <p class="text-gray-400 text-sm">Nenhuma barbearia encontrada</p>
      </div>
    </div>
  </div>

  <!-- Bottom Navigation -->
  <div class="fixed bottom-0 left-0 right-0 bg-[#1c1c1e] border-t border-gray-800">
    <div class="max-w-[400px] mx-auto px-6 py-3 flex justify-around">
      <a href="home.html" class="flex flex-col items-center gap-1 text-gray-400 hover:text-primary transition-colors">
        <span class="material-symbols-outlined">home</span>
        <span class="text-xs">Início</span>
      </a>
      <a href="barbershops.html" class="flex flex-col items-center gap-1 text-primary">
        <span class="material-symbols-outlined">storefront</span>
        <span class="text-xs">Barbearias</span>
      </a>
      <a href="my-appointments.html" class="flex flex-col items-center gap-1 text-gray-400 hover:text-primary transition-colors">
        <span class="material-symbols-outlined">calendar_month</span>
        <span class="text-xs">Agendamentos</span>
      </a>
      <a href="my-profile.html" class="flex flex-col items-center gap-1 text-gray-400 hover:text-primary transition-colors">
        <span class="material-symbols-outlined">person</span>
        <span class="text-xs">Perfil</span>
      </a>
    </div>
  </div>

  <!-- Scripts -->
  <script type="module">
    import { DemoAuthService, DemoBarbershopApi } from '../js/demo.js';
    import { showToast } from '../js/utils.js';

    if (!DemoAuthService.isAuthenticated()) {
      window.location.href = 'login.html';
    }

    const searchInput = document.getElementById('searchInput');
    const filterTabs = document.querySelectorAll('.filter-tab');
    const barbershopsList = document.getElementById('barbershopsList');
    const loadingState = document.getElementById('loadingState');
    const emptyState = document.getElementById('emptyState');

    let allBarbershops = [];
    let currentFilter = 'all';
    let currentSearch = '';

    // Load barbershops on page load
    async function loadBarbershops() {
      try {
        loadingState.classList.remove('hidden');
        barbershopsList.classList.add('hidden');
        emptyState.classList.add('hidden');

        allBarbershops = await DemoBarbershopApi.getBarbershops();
        renderBarbershops();
      } catch (error) {
        console.error('Erro ao carregar barbearias:', error);
        showToast('Erro ao carregar barbearias', 'error');
        emptyState.classList.remove('hidden');
      } finally {
        loadingState.classList.add('hidden');
      }
    }

    // Render barbershops
    function renderBarbershops() {
      let filtered = allBarbershops;

      // Apply search filter
      if (currentSearch) {
        filtered = filtered.filter(b => 
          b.name.toLowerCase().includes(currentSearch.toLowerCase()) ||
          b.address.toLowerCase().includes(currentSearch.toLowerCase())
        );
      }

      // Apply category filter
      if (currentFilter === 'nearby') {
        filtered = filtered.sort((a, b) => (a.distance || 999) - (b.distance || 999));
      } else if (currentFilter === 'rated') {
        filtered = filtered.sort((a, b) => (b.rating || 0) - (a.rating || 0));
      }

      if (filtered.length === 0) {
        barbershopsList.classList.add('hidden');
        emptyState.classList.remove('hidden');
        return;
      }

      barbershopsList.innerHTML = filtered.map(barbershop => `
        <a href="barbershop-detail.html?id=${barbershop.id}" class="block bg-[#1c1c1e] rounded-2xl overflow-hidden hover:bg-[#2c2c2e] transition-colors group">
          <div class="p-4">
            <div class="flex items-start justify-between mb-2">
              <div>
                <h3 class="font-semibold text-lg">${barbershop.name}</h3>
                <p class="text-xs text-gray-400 mt-1">${barbershop.address}</p>
              </div>
              <div class="text-right">
                <div class="flex items-center gap-1 text-sm font-medium">
                  <span class="material-symbols-outlined text-base text-yellow-500">star</span>
                  ${barbershop.rating?.toFixed(1) || 'N/A'}
                </div>
                <p class="text-xs text-gray-400 mt-1">${barbershop.reviewCount || 0} avaliações</p>
              </div>
            </div>

            <div class="flex items-center justify-between mt-3 pt-3 border-t border-gray-800">
              <div class="flex items-center gap-2 text-xs text-gray-400">
                <span class="material-symbols-outlined text-sm">access_time</span>
                ${barbershop.distance ? `<span>${barbershop.distance.toFixed(1)} km</span>` : '<span>Horário aberto</span>'}
              </div>
              <button class="text-primary font-medium text-sm hover:text-primary/80 transition-colors">
                Agendar
                <span class="material-symbols-outlined text-sm inline">arrow_forward</span>
              </button>
            </div>
          </div>
        </a>
      `).join('');

      barbershopsList.classList.remove('hidden');
      emptyState.classList.add('hidden');
    }

    // Search handler with debounce
    let searchTimeout;
    searchInput.addEventListener('input', (e) => {
      clearTimeout(searchTimeout);
      currentSearch = e.target.value;
      searchTimeout = setTimeout(renderBarbershops, 300);
    });

    // Filter tabs
    filterTabs.forEach(tab => {
      tab.addEventListener('click', () => {
        filterTabs.forEach(t => {
          t.classList.remove('bg-primary', 'text-white');
          t.classList.add('bg-[#1c1c1e]', 'text-gray-400');
        });
        tab.classList.add('bg-primary', 'text-white');
        tab.classList.remove('bg-[#1c1c1e]', 'text-gray-400');
        
        currentFilter = tab.dataset.filter;
        renderBarbershops();
      });
    });

    // Initial load
    loadBarbershops();
  </script>
</body>
</html>
