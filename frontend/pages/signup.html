<!DOCTYPE html>
<html class="dark" lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>JUMP - Cadastro</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#0d59f2",
                        "background-light": "#f5f6f8",
                        "background-dark": "#000000",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "1rem",
                        "lg": "1.25rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .squircle-radius {
            border-radius: 20px;
        }
        body {
            background-color: #000000;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-dark font-display text-white antialiased">
<div class="flex min-h-screen w-full flex-col items-center justify-between px-6 py-12">
<!-- Header / Logo -->
<div class="mt-4 flex flex-col items-center gap-2">
<div class="flex h-12 w-12 items-center justify-center rounded-xl bg-primary">
<span class="text-2xl font-black tracking-tighter">J</span>
</div>
<h1 class="text-2xl font-bold tracking-[0.2em] uppercase mt-2">Jump</h1>
</div>

<!-- Form Section -->
<div class="w-full max-w-[400px] flex flex-col gap-4 mt-6">
<div class="flex flex-col gap-2 mb-6">
<h2 class="text-2xl font-bold text-white">Criar Conta</h2>
<p class="text-sm text-gray-400">Junte-se à revolução dos agendamentos</p>
</div>

<div class="flex flex-col gap-4">
<!-- Nome Field -->
<div class="flex flex-col gap-1.5">
<label class="px-1 text-sm font-medium text-gray-400">Nome Completo</label>
<input id="name" class="w-full h-14 bg-[#1c1c1e] border border-gray-800 focus:border-primary focus:ring-1 focus:ring-primary text-white squircle-radius px-4 placeholder:text-gray-600 transition-all outline-none" placeholder="Seu nome" type="text" required/>
</div>

<!-- Email Field -->
<div class="flex flex-col gap-1.5">
<label class="px-1 text-sm font-medium text-gray-400">E-mail</label>
<input id="email" class="w-full h-14 bg-[#1c1c1e] border border-gray-800 focus:border-primary focus:ring-1 focus:ring-primary text-white squircle-radius px-4 placeholder:text-gray-600 transition-all outline-none" placeholder="seu@email.com" type="email" required/>
</div>

<!-- Phone Field -->
<div class="flex flex-col gap-1.5">
<label class="px-1 text-sm font-medium text-gray-400">Telefone</label>
<input id="phone" class="w-full h-14 bg-[#1c1c1e] border border-gray-800 focus:border-primary focus:ring-1 focus:ring-primary text-white squircle-radius px-4 placeholder:text-gray-600 transition-all outline-none" placeholder="(11) 99999-9999" type="tel" required/>
</div>

<!-- Password Field -->
<div class="flex flex-col gap-1.5">
<label class="px-1 text-sm font-medium text-gray-400">Senha</label>
<div class="relative">
<input id="password" class="w-full h-14 bg-[#1c1c1e] border border-gray-800 focus:border-primary focus:ring-1 focus:ring-primary text-white squircle-radius px-4 pr-12 placeholder:text-gray-600 transition-all outline-none" placeholder="••••••••" type="password" required/>
<button type="button" class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-500 hover:text-gray-300 transition-colors" id="togglePassword1">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>

<!-- Confirm Password Field -->
<div class="flex flex-col gap-1.5">
<label class="px-1 text-sm font-medium text-gray-400">Confirmar Senha</label>
<div class="relative">
<input id="confirmPassword" class="w-full h-14 bg-[#1c1c1e] border border-gray-800 focus:border-primary focus:ring-1 focus:ring-primary text-white squircle-radius px-4 pr-12 placeholder:text-gray-600 transition-all outline-none" placeholder="••••••••" type="password" required/>
<button type="button" class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-500 hover:text-gray-300 transition-colors" id="togglePassword2">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>

<!-- Terms Checkbox -->
<div class="flex items-start gap-3 my-2">
<input type="checkbox" id="terms" class="w-5 h-5 mt-1 accent-primary cursor-pointer" required/>
<label for="terms" class="text-sm text-gray-400 cursor-pointer">
Concordo com os <a href="#" class="text-primary font-medium hover:underline">Termos de Serviço</a> e <a href="#" class="text-primary font-medium hover:underline">Política de Privacidade</a>
</label>
</div>
</div>

<!-- Error Message -->
<div id="errorMessage" class="hidden text-sm text-red-500 px-2 py-2 bg-red-500 bg-opacity-10 rounded-lg"></div>

<!-- Main CTA -->
<button id="signupButton" class="w-full h-14 bg-primary text-white font-semibold text-lg rounded-full mt-4 hover:opacity-90 active:scale-[0.98] transition-all">
Criar Conta
</button>

<!-- Divider -->
<div class="flex items-center gap-4 my-6">
<div class="h-[1px] flex-1 bg-gray-800"></div>
<span class="text-xs font-medium text-gray-500 uppercase tracking-widest">ou</span>
<div class="h-[1px] flex-1 bg-gray-800"></div>
</div>

<!-- Social Auth -->
<div class="grid grid-cols-2 gap-3">
<button class="flex h-14 items-center justify-center rounded-full bg-white text-black hover:bg-gray-200 transition-colors">
<svg class="w-6 h-6" fill="currentColor" viewbox="0 0 24 24">
<path d="M12.152 6.896c-.948 0-2.415-1.078-3.96-1.04-2.04.027-3.91 1.183-4.961 3.014-2.117 3.675-.546 9.103 1.519 12.09 1.013 1.454 2.208 3.09 3.792 3.039 1.52-.065 2.09-.987 3.935-.987 1.831 0 2.35.987 3.96.948 1.637-.026 2.676-1.48 3.676-2.948 1.156-1.688 1.636-3.325 1.662-3.415-.039-.013-3.182-1.221-3.22-4.857-.026-3.04 2.48-4.494 2.597-4.559-1.429-2.09-3.623-2.324-4.39-2.376-2-.156-3.675 1.09-4.61 1.09zM15.53 3.83c.843-1.012 1.4-2.427 1.245-3.83-1.207.052-2.662.805-3.532 1.818-.78.896-1.454 2.338-1.273 3.714 1.338.104 2.715-.688 3.559-1.702z"></path>
</svg>
</button>
<button class="flex h-14 items-center justify-center rounded-full bg-[#1877F2] hover:opacity-90 transition-colors">
<svg class="w-7 h-7" fill="white" viewbox="0 0 24 24">
<path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"></path>
</svg>
</button>
</div>
</div>

<!-- Footer -->
<div class="mt-8 text-center">
<p class="text-sm text-gray-500">
Já tem uma conta? 
<a class="text-primary font-semibold ml-1 hover:underline" href="login.html">Faça login</a>
</p>
</div>

<!-- Scripts -->
<script type="module">
import { DemoAuthService } from '../js/demo.js';
import { showToast, showLoading, hideLoading, validateEmail, formatPhone } from '../js/utils.js';

const nameInput = document.getElementById('name');
const emailInput = document.getElementById('email');
const phoneInput = document.getElementById('phone');
const passwordInput = document.getElementById('password');
const confirmPasswordInput = document.getElementById('confirmPassword');
const termsCheckbox = document.getElementById('terms');
const signupButton = document.getElementById('signupButton');
const errorMessage = document.getElementById('errorMessage');
const togglePassword1 = document.getElementById('togglePassword1');
const togglePassword2 = document.getElementById('togglePassword2');

// Toggle password visibility
togglePassword1.addEventListener('click', () => {
  const type = passwordInput.type === 'password' ? 'text' : 'password';
  passwordInput.type = type;
});

togglePassword2.addEventListener('click', () => {
  const type = confirmPasswordInput.type === 'password' ? 'text' : 'password';
  confirmPasswordInput.type = type;
});

// Auto-format phone input
phoneInput.addEventListener('input', (e) => {
  e.target.value = formatPhone(e.target.value);
});

// Handle signup form submission
signupButton.addEventListener('click', async (e) => {
  e.preventDefault();
  
  const name = nameInput.value.trim();
  const email = emailInput.value.trim();
  const phone = phoneInput.value.replace(/\D/g, '');
  const password = passwordInput.value;
  const confirmPassword = confirmPasswordInput.value;

  // Validate inputs
  if (!name || name.length < 3) {
    showToast('Por favor, insira um nome válido', 'error');
    return;
  }

  if (!email || !validateEmail(email)) {
    showToast('Por favor, insira um email válido', 'error');
    return;
  }

  if (!phone || phone.length !== 11) {
    showToast('Por favor, insira um telefone válido', 'error');
    return;
  }

  if (!password || password.length < 8) {
    showToast('A senha deve ter pelo menos 8 caracteres', 'error');
    return;
  }

  if (password !== confirmPassword) {
    showToast('As senhas não coincidem', 'error');
    return;
  }

  if (!termsCheckbox.checked) {
    showToast('Você precisa aceitar os termos de serviço', 'error');
    return;
  }

  try {
    showLoading('Criando sua conta...');
    signupButton.disabled = true;
    errorMessage.classList.add('hidden');

    const { user } = DemoAuthService.signup({
      name,
      email,
      phone,
      password,
      role: 'client'
    });
    
    hideLoading();
    showToast('Conta criada com sucesso!', 'success');
    window.location.href = 'home.html';
  } catch (error) {
    hideLoading();
    signupButton.disabled = false;
    const message = error.message || 'Erro ao criar conta';
    errorMessage.textContent = message;
    errorMessage.classList.remove('hidden');
    showToast(message, 'error');
  }
});

// Allow Enter key to submit
[nameInput, emailInput, phoneInput, confirmPasswordInput].forEach(input => {
  input.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') signupButton.click();
  });
});
</script>
</div>

</body></html>
