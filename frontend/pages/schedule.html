<!DOCTYPE html>
<html class="dark" lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>JUMP - Agendar Horário</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,typography,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#0d59f2",
          },
          fontFamily: {
            "display": ["Inter", "sans-serif"]
          },
        },
      },
    }
  </script>
  <style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    body {
      background-color: #000000;
    }
  </style>
</head>
<body class="bg-black font-display text-white antialiased">
  <div class="flex min-h-screen w-full flex-col items-center px-6 pb-32">
    <div class="w-full max-w-[400px] mt-6">
      <!-- Header -->
      <div class="flex items-center justify-between mb-8">
        <button id="backBtn" class="p-2 hover:bg-[#1c1c1e] rounded-lg transition-colors">
          <span class="material-symbols-outlined">arrow_back</span>
        </button>
        <h1 class="text-2xl font-bold">Agendar</h1>
        <div class="w-10"></div>
      </div>

      <!-- Service Card -->
      <div class="bg-[#1c1c1e] p-4 rounded-lg mb-8 border border-gray-800">
        <h3 class="font-semibold mb-2">Barbearia Premium</h3>
        <p class="text-sm text-gray-400">João Silva - Especialista</p>
      </div>

      <!-- Serviço Selecionado -->
      <div class="mb-8">
        <h2 class="text-sm font-semibold text-gray-400 mb-4">SERVIÇO</h2>
        <div class="bg-[#1c1c1e] p-4 rounded-lg border border-primary">
          <div class="flex justify-between">
            <div>
              <p class="font-semibold">Corte</p>
              <p class="text-sm text-gray-400">30 minutos</p>
            </div>
            <span class="text-primary font-bold">R$ 60</span>
          </div>
        </div>
      </div>

      <!-- Data -->
      <div class="mb-8">
        <h2 class="text-sm font-semibold text-gray-400 mb-4">DATA</h2>
        <div class="flex gap-2 overflow-x-auto pb-2">
          <button class="flex-shrink-0 w-16 h-20 bg-[#1c1c1e] rounded-lg flex flex-col items-center justify-center border border-gray-800 hover:border-primary transition-colors">
            <span class="text-xs text-gray-500">Seg</span>
            <span class="text-xl font-bold">10</span>
          </button>
          <button class="flex-shrink-0 w-16 h-20 bg-[#1c1c1e] rounded-lg flex flex-col items-center justify-center border border-gray-800 hover:border-primary transition-colors">
            <span class="text-xs text-gray-500">Ter</span>
            <span class="text-xl font-bold">11</span>
          </button>
          <button class="flex-shrink-0 w-16 h-20 bg-[#1c1c1e] rounded-lg flex flex-col items-center justify-center border border-primary">
            <span class="text-xs text-primary">Qua</span>
            <span class="text-xl font-bold text-primary">12</span>
          </button>
          <button class="flex-shrink-0 w-16 h-20 bg-[#1c1c1e] rounded-lg flex flex-col items-center justify-center border border-gray-800 hover:border-primary transition-colors">
            <span class="text-xs text-gray-500">Qui</span>
            <span class="text-xl font-bold">13</span>
          </button>
        </div>
      </div>

      <!-- Horário -->
      <div class="mb-8">
        <h2 class="text-sm font-semibold text-gray-400 mb-4">HORÁRIO</h2>
        
        <div class="mb-6">
          <p class="text-xs text-gray-500 mb-3">Manhã</p>
          <div class="grid grid-cols-3 gap-2">
            <button class="p-3 bg-[#1c1c1e] rounded-lg border border-gray-800 hover:border-primary transition-colors text-sm">09:00</button>
            <button class="p-3 bg-[#1c1c1e] rounded-lg border border-gray-800 hover:border-primary transition-colors text-sm">09:30</button>
            <button class="p-3 bg-primary text-black rounded-lg border border-primary font-semibold text-sm">10:00</button>
            <button class="p-3 bg-[#1c1c1e] rounded-lg border border-gray-800 hover:border-primary transition-colors text-sm">10:30</button>
            <button class="p-3 bg-[#1c1c1e] rounded-lg border border-gray-800 hover:border-primary transition-colors text-sm">11:00</button>
            <button class="p-3 bg-[#1c1c1e] rounded-lg border border-gray-800 opacity-50 cursor-not-allowed text-sm">11:30</button>
          </div>
        </div>

        <div>
          <p class="text-xs text-gray-500 mb-3">Tarde</p>
          <div class="grid grid-cols-3 gap-2">
            <button class="p-3 bg-[#1c1c1e] rounded-lg border border-gray-800 hover:border-primary transition-colors text-sm">13:00</button>
            <button class="p-3 bg-[#1c1c1e] rounded-lg border border-gray-800 hover:border-primary transition-colors text-sm">13:30</button>
            <button class="p-3 bg-[#1c1c1e] rounded-lg border border-gray-800 hover:border-primary transition-colors text-sm">14:00</button>
            <button class="p-3 bg-[#1c1c1e] rounded-lg border border-gray-800 hover:border-primary transition-colors text-sm">14:30</button>
            <button class="p-3 bg-[#1c1c1e] rounded-lg border border-gray-800 hover:border-primary transition-colors text-sm">15:00</button>
            <button class="p-3 bg-[#1c1c1e] rounded-lg border border-gray-800 hover:border-primary transition-colors text-sm">15:30</button>
          </div>
        </div>
      </div>

      <!-- Resumo -->
      <div class="bg-[#1c1c1e] p-4 rounded-lg mb-6 border border-gray-800">
        <h3 class="text-sm font-semibold text-gray-400 mb-4">RESUMO</h3>
        <div class="space-y-2 mb-4 text-sm">
          <div class="flex justify-between">
            <span class="text-gray-400">Serviço:</span>
            <span>Corte</span>
          </div>
          <div class="flex justify-between">
            <span class="text-gray-400">Data:</span>
            <span>12 de Janeiro</span>
          </div>
          <div class="flex justify-between">
            <span class="text-gray-400">Hora:</span>
            <span>10:00</span>
          </div>
          <div class="flex justify-between">
            <span class="text-gray-400">Barbeiro:</span>
            <span>João Silva</span>
          </div>
        </div>
        <div class="h-px bg-gray-700 my-4"></div>
        <div class="flex justify-between font-semibold">
          <span>Total:</span>
          <span class="text-primary text-lg">R$ 60,00</span>
        </div>
      </div>
    </div>
  </div>

  <!-- CTA Button -->
  <div class="fixed bottom-0 left-0 right-0 bg-[#0a0a0a] border-t border-gray-800">
    <div class="max-w-[400px] mx-auto px-6 py-4">
      <button id="confirmBtn" class="w-full bg-primary text-black py-3 rounded-lg font-bold hover:opacity-90 transition-opacity">
        Confirmar Agendamento
      </button>
    </div>
  </div>

  <script type="module">
import { DemoAuthService } from '../js/demo.js';
import { showToast, showLoading, hideLoading } from '../js/utils.js';

if (!DemoAuthService.isAuthenticated()) {
  window.location.href = 'login.html';
}

document.getElementById('backBtn').addEventListener('click', () => {
  window.history.back();
});

document.getElementById('confirmBtn').addEventListener('click', async () => {
  try {
    showLoading('Confirmando...');
    await new Promise(resolve => setTimeout(resolve, 1000));
    hideLoading();
    showToast('Agendamento confirmado!', 'success');
    setTimeout(() => {
      window.location.href = 'confirmation.html';
    }, 1500);
  } catch (error) {
    hideLoading();
    showToast(error.message, 'error');
  }
});
  </script>
</body>
</html>
